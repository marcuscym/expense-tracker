<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#26215C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Budget</title>
<style>
  :root{
    --accent:#26215C; --bg:#f6f6f8; --card:#fff; --text:#1a1a1a; --muted:#6b6b72;
    --line:rgba(0,0,0,.09); --field:#f1f1f5; --danger:#B3261E; --good:#1D9E75;
  }
  @media (prefers-color-scheme:dark){ :root{
    --accent:#2f296e; --bg:#121216; --card:#1c1c22; --text:#f2f2f4; --muted:#9a9aa2;
    --line:rgba(255,255,255,.11); --field:#26262e; --danger:#F2A9A4; --good:#5DCAA5;
  }}
  *{box-sizing:border-box}
  body{margin:0; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text)}
  button,input{font:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  #app{max-width:440px; margin:0 auto; padding:10px 14px calc(40px + env(safe-area-inset-bottom))}

  .upd{display:flex; align-items:center; justify-content:space-between; gap:10px; background:#EF9F27; color:#412402;
       border-radius:12px; padding:9px 12px; font-size:14px; font-weight:500; margin-bottom:10px}
  .upd button{background:#412402; color:#fff; border:none; border-radius:8px; padding:7px 14px; font-weight:600}
  .notice{background:#EF9F27; color:#412402; border-radius:12px; padding:8px 12px; font-size:13px; margin-bottom:10px}

  .hdr{display:flex; align-items:center; justify-content:space-between; padding:4px 0 12px}
  .hdr .m{display:flex; align-items:center; gap:10px}
  .hdr b{font-size:17px; font-weight:600}
  .ib{width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:18px; line-height:1}

  .hero{background:var(--accent); color:#fff; border-radius:20px; padding:18px 18px 16px; margin-bottom:14px}
  .hero .lbl{font-size:13px; opacity:.8}
  .hero .big{font-size:36px; font-weight:600; letter-spacing:-.5px; margin:2px 0 10px}
  .hero.over .big{color:#FFB4AE}
  .track{height:8px; border-radius:99px; background:rgba(255,255,255,.2); overflow:hidden}
  .track i{display:block; height:100%; width:0; border-radius:99px; background:#8FD6B5; transition:width .2s}
  .hero.warn .track i{background:#F5C26B}
  .hero.over .track i{background:#F28B82}
  .hero .pct{font-size:12px; opacity:.8; margin:7px 0 14px}
  .hero .two{display:flex; gap:12px; align-items:flex-end; border-top:1px solid rgba(255,255,255,.16); padding-top:13px}
  .hero .two>div{flex:1; min-width:0}
  .hero .two small{display:block; font-size:12px; opacity:.8; margin-bottom:4px}
  .hero .two b{font-size:18px; font-weight:600}
  .sal{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.28);
       border-radius:11px; padding:0 10px; height:44px}
  .sal span{opacity:.85; font-size:14px}
  .sal input{flex:1; min-width:0; width:100%; background:none; border:none; outline:none; color:#fff; font-size:18px; font-weight:600; text-align:right}
  .sal input::placeholder{color:rgba(255,255,255,.5)}

  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 14px 10px; margin-bottom:14px}
  .card h3{margin:0 0 8px; font-size:13px; font-weight:600; color:var(--muted); letter-spacing:.2px}
  .lw{padding:5px 0}
  .line{display:flex; gap:6px; align-items:center}
  .line input{height:46px; border-radius:11px; border:1px solid var(--line); background:var(--field); color:var(--text); padding:0 11px; font-size:16px; min-width:0}
  .line .lb{flex:1}
  .line .am{width:104px; text-align:right; flex:0 0 104px}
  .line .pl,.line .x{flex:0 0 38px; width:38px; height:46px; border-radius:11px; background:none; padding:0}
  .line .pl{border:1px solid var(--line); color:var(--accent); font-size:20px; font-weight:600}
  @media (prefers-color-scheme:dark){ .line .pl{color:#CECBF6} }
  .line .x{border:none; color:var(--muted); font-size:22px}
  .sum{font-size:12px; color:var(--muted); text-align:right; padding:3px 88px 0 0}
  .add{display:block; width:100%; height:48px; margin:8px 0 4px; border:1.5px dashed var(--line); border-radius:12px;
       background:none; color:var(--accent); font-weight:600}
  @media (prefers-color-scheme:dark){ .add{color:#CECBF6} }
  .tot{display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--line); margin-top:10px; padding:11px 2px 4px; font-weight:600}
  .hint{font-size:12px; color:var(--muted); padding:8px 2px 4px}
  .empty{padding:6px 2px 4px}
  .empty p{margin:0 0 12px; color:var(--muted); font-size:14px}
  .row2{display:flex; gap:8px; margin-bottom:8px}
  .btn{flex:1; min-height:46px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-weight:600; padding:0 12px}
  .btn.pri{background:var(--accent); color:#fff; border-color:transparent}
  .btn.dng{color:var(--danger); border-color:var(--danger); background:none}


  .seg{display:flex; background:var(--field); border-radius:13px; padding:3px; margin-bottom:12px}
  .seg button{flex:1; height:40px; border:none; border-radius:10px; background:none; color:var(--muted); font-weight:600}
  .seg button.on{background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.14)}
  .chead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px}
  .chead b{font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .mini{height:34px; padding:0 14px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--accent); font-weight:600}
  @media (prefers-color-scheme:dark){ .mini{color:#CECBF6} }
  .lbl2{font-size:12px; color:var(--muted)}
  .owed{font-size:30px; font-weight:600; letter-spacing:-.4px; margin:0 0 8px}
  .owed.cr{color:var(--good)}
  .ctrack{height:8px; border-radius:99px; background:var(--field); overflow:hidden}
  .ctrack i{display:block; height:100%; width:0; border-radius:99px; background:var(--accent); transition:width .2s}
  .ctrack.warn i{background:#EF9F27} .ctrack.over i{background:#E24B4A}
  .due{font-size:13px; color:var(--text); margin-top:8px; font-weight:500}
  .addbox{border-top:1px solid var(--line); margin-top:14px; padding-top:12px}
  .meta2{display:flex; gap:8px; align-items:center; padding:5px 0 0}
  .meta2 .dt{height:36px; border-radius:9px; border:1px solid var(--line); background:var(--field); color:var(--text); padding:0 8px; font-size:14px}
  .kind{height:36px; padding:0 14px; border-radius:99px; border:1px solid var(--line); background:none; color:var(--muted); font-size:13px; font-weight:600}
  .kind.pay{background:var(--good); color:#fff; border-color:transparent}
  .cedit{background:var(--field); border-radius:12px; padding:12px; margin:4px 0 12px}
  .cedit label{display:block; margin-bottom:10px}
  .cedit label span{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .cedit input{width:100%; height:44px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); padding:0 11px; font-size:16px}

  .hist{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; text-align:left;
        background:none; border:none; border-top:1px solid var(--line); padding:11px 2px; color:inherit}
  .hist:first-of-type{border-top:none}
  .hist .a{font-weight:600; font-size:15px}
  .hist .b{font-size:12px; color:var(--muted)}
  .hist .r{font-weight:600; font-size:15px; white-space:nowrap}
  .hist .r.neg{color:var(--danger)} .hist .r.pos{color:var(--good)}

  #toasts{position:fixed; left:0; right:0; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:30;
          display:flex; justify-content:center; pointer-events:none}
  .toast{pointer-events:auto; background:var(--text); color:var(--bg); border-radius:999px; padding:11px 18px; font-size:14px;
         font-weight:500; display:flex; gap:14px; align-items:center; box-shadow:0 6px 18px rgba(0,0,0,.28); max-width:calc(100vw - 28px)}
  .toast button{background:none; border:none; color:#9db8ff; font-weight:700; padding:0}

  .ov{position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center}
  .sheet{background:var(--card); width:100%; max-width:440px; border-radius:20px 20px 0 0; padding:18px 16px calc(22px + env(safe-area-inset-bottom));
         max-height:90vh; overflow-y:auto; -webkit-overflow-scrolling:touch}
  @media (min-width:500px){ .ov{align-items:center} .sheet{border-radius:20px} }
  .sheet h2{margin:0 0 4px; font-size:18px}
  .sheet h4{margin:20px 0 6px; font-size:13px; color:var(--muted); font-weight:600}
  .sheet p{margin:0 0 10px; color:var(--muted); font-size:14px}
  .sheet input[type=file]{width:100%; padding:10px 0; font-size:14px}
  .msg{font-size:13px; margin:6px 0 0; color:var(--muted)}
  .msg.bad{color:var(--danger)}
</style>
</head>
<body>
<div id="app">
  <div id="banner"></div>
  <div id="content"></div>
</div>
<div id="toasts"></div>
<div id="modal" class="ov" hidden><div class="sheet"></div></div>
<datalist id="labels"></datalist>
<script>
"use strict";

const APP_VERSION = "v25";
const KEY = "budget-sheet-v2";
const OLD_KEY = "expense-tracker-v1";   // earlier app's data: read once, never modified
let storageOK = true;
let state;
let selectedMonth;
let justAddedId = null;
let ui = {};
let page = "budget";
try { if (localStorage.getItem("budget-page") === "cards") page = "cards"; } catch (e) {}
const editing = new Set();      // card ids whose settings are open
const showAllFor = new Set();   // card ids showing their full history
let cardRefs = {}, cardsHero = null;

/* ---------- small helpers ---------- */
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10));
const pad2 = (n) => String(n).padStart(2, "0");
const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const parseKey = (k) => k.split("-").map(Number);
const fmtMonth = (k) => { const [y, m] = parseKey(k); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }); };
const fmtMonthShort = (k) => { const [y, m] = parseKey(k); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" }); };
const shiftMonth = (k, d) => { const [y, m] = parseKey(k); return monthKey(new Date(y, m - 1 + d, 1)); };
const nf = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => "RM " + nf.format(n);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtDay = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { day: "numeric", month: "short" }); };

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (tag === "button" && !(props && "type" in props)) n.type = "button";
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "className") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n[k.toLowerCase()] = v;
    else if (v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null) continue; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
  return n;
}

/* An amount box can hold a single number ("820") or several added together ("15+22.5+8"). */
const NUM = /[+-]?\d*\.?\d+/g;
const terms = (expr) => String(expr || "").replace(/,/g, "").match(NUM) || [];
const evalExpr = (expr) => Math.round(terms(expr).reduce((t, x) => t + parseFloat(x), 0) * 100) / 100;

/* ---------- data ---------- */
const emptyState = () => ({ version: 2, salary: {}, months: {}, cards: [] });
const isKey = (k) => /^\d{4}-\d{2}$/.test(k);
const isDay = (d) => /^\d{4}-\d{2}-\d{2}$/.test(d || "");

function normV2(obj) {
  const s = emptyState();
  if (obj.salary && typeof obj.salary === "object")
    for (const [k, v] of Object.entries(obj.salary)) if (isKey(k) && Number.isFinite(Number(v)) && Number(v) >= 0) s.salary[k] = Number(v);
  if (obj.months && typeof obj.months === "object")
    for (const [k, arr] of Object.entries(obj.months)) {
      if (!isKey(k) || !Array.isArray(arr)) continue;
      s.months[k] = arr.filter((l) => l && typeof l === "object")
        .map((l) => ({ id: typeof l.id === "string" ? l.id : uid(), label: String(l.label || "").slice(0, 60), expr: String(l.expr || "").slice(0, 200) }));
    }
  if (Array.isArray(obj.cards))
    s.cards = obj.cards.filter((c) => c && typeof c === "object").map((c) => ({
      id: typeof c.id === "string" ? c.id : uid(),
      name: String(c.name || "Card").slice(0, 40),
      limit: Number.isFinite(Number(c.limit)) && Number(c.limit) > 0 ? Number(c.limit) : 0,
      due: Math.min(31, Math.max(0, parseInt(c.due, 10) || 0)),
      entries: (Array.isArray(c.entries) ? c.entries : []).filter((e) => e && typeof e === "object" && Number.isFinite(Number(e.amount)))
        .map((e) => ({ id: typeof e.id === "string" ? e.id : uid(), date: isDay(e.date) ? e.date : todayISO(),
          kind: e.kind === "payment" ? "payment" : "charge", label: String(e.label || "").slice(0, 60),
          amount: Math.round(Math.abs(Number(e.amount)) * 100) / 100 })),
    }));
  return s;
}

/* Earlier versions logged each expense under a category. Fold them into one line per
   category per month; the line keeps every amount ("15+60+22.5") so nothing is lost. */
function migrateV1(obj) {
  const s = emptyState();
  const cats = new Map((Array.isArray(obj.categories) ? obj.categories : [])
    .filter((c) => c && typeof c.id === "string").map((c) => [c.id, String(c.name || "Other")]));
  const byMonth = {};
  (Array.isArray(obj.expenses) ? obj.expenses : []).forEach((e) => {
    if (!e || !/^\d{4}-\d{2}-\d{2}$/.test(e.date || "") || !Number.isFinite(Number(e.amount))) return;
    const mk = e.date.slice(0, 7), label = cats.get(e.categoryId) || "Other";
    const m = byMonth[mk] || (byMonth[mk] = new Map());
    if (!m.has(label)) m.set(label, []);
    m.get(label).push(Math.round(Number(e.amount) * 100) / 100);
  });
  for (const [mk, m] of Object.entries(byMonth))
    s.months[mk] = [...m].map(([label, amts]) => ({ id: uid(), label, expr: amts.join("+") }));
  if (Number(obj.income) > 0) s.salary[monthKey(new Date())] = Number(obj.income);
  return s;
}

function normalize(obj) {
  if (obj && typeof obj === "object" && obj.months) return normV2(obj);
  if (obj && typeof obj === "object" && (Array.isArray(obj.expenses) || Array.isArray(obj.categories))) return migrateV1(obj);
  return emptyState();
}

function starterLines() { return ["Rent", "Bills", "Food", "Transport"].map((label) => ({ id: uid(), label, expr: "" })); }

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }
  if (raw) {
    try { state = normalize(JSON.parse(raw)); return; }
    catch (e) { try { localStorage.setItem(KEY + "-corrupt", raw); } catch (_) {} }
  }
  state = emptyState();
  let old = null;
  try { old = localStorage.getItem(OLD_KEY); } catch (e) {}
  if (old) { try { state = normalize(JSON.parse(old)); } catch (e) { state = emptyState(); } }
  if (Object.keys(state.months).length === 0) state.months[monthKey(new Date())] = starterLines();
  save();
}

function save() {
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    storageOK = false;
    const b = document.getElementById("banner");
    b.textContent = "";
    b.appendChild(el("div", { className: "notice", text: "Couldn't save — changes will be lost when you close this page." }));
  }
}

const linesOf = (k) => state.months[k] || (state.months[k] = []);
const spentCents = (k) => (state.months[k] || []).reduce((t, l) => t + Math.round(evalExpr(l.expr) * 100), 0);
function salaryFor(k) {          // latest salary set on or before this month
  let best = null;
  for (const x of Object.keys(state.salary)) if (x <= k && (best === null || x > best)) best = x;
  return best ? state.salary[best] : 0;
}
function lastMonthWithLines(k) {
  let x = k;
  for (let i = 0; i < 36; i++) {
    x = shiftMonth(x, -1);
    const a = state.months[x];
    if (a && a.some((l) => l.label.trim() || l.expr.trim())) return x;
  }
  return null;
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, actionLabel, fn) {
  const host = document.getElementById("toasts");
  host.textContent = "";
  const t = el("div", { className: "toast" }, el("span", { text: msg }));
  if (actionLabel) t.appendChild(el("button", { onClick: () => { host.textContent = ""; clearTimeout(toastTimer); fn(); } }, actionLabel));
  host.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (host.firstChild === t) host.textContent = ""; }, actionLabel ? 6000 : 2400);
}

/* ---------- screen ---------- */
function render() {
  const arr = state.months[selectedMonth];
  if (arr) {                       // drop blank lines left behind (except the one just added)
    const kept = arr.filter((l) => l.label.trim() || l.expr.trim() || l.id === justAddedId);
    if (kept.length !== arr.length) { state.months[selectedMonth] = kept; save(); }
  }
  justAddedId = null;
  const root = document.getElementById("content");
  root.textContent = "";
  root.appendChild(switcher());
  if (page === "cards") { ui = {}; cardsPage(root); refreshLabels(); return; }
  root.appendChild(header());
  root.appendChild(summary());
  root.appendChild(sheet());
  const h = history();
  if (h) root.appendChild(h);
  updateTotals();
  refreshLabels();
}

function header() {
  return el("div", { className: "hdr" },
    el("div", { className: "m" },
      el("button", { className: "ib", "aria-label": "Previous month", onClick: () => { selectedMonth = shiftMonth(selectedMonth, -1); render(); } }, "‹"),
      el("b", { text: fmtMonth(selectedMonth) }),
      el("button", { className: "ib", "aria-label": "Next month", onClick: () => { selectedMonth = shiftMonth(selectedMonth, 1); render(); } }, "›")),
    el("button", { className: "ib", "aria-label": "Settings", onClick: openSettings }, "⚙"));
}

function summary() {
  const salIn = el("input", { type: "text", inputmode: "decimal", placeholder: "0.00", autocomplete: "off", "aria-label": "Net salary",
    value: salaryFor(selectedMonth) > 0 ? String(salaryFor(selectedMonth)) : "" });
  salIn.oninput = () => {
    const v = parseFloat(salIn.value.replace(/,/g, ""));
    state.salary[selectedMonth] = Number.isFinite(v) && v > 0 ? v : 0;
    save(); updateTotals();
  };
  salIn.onkeydown = (e) => { if (e.key === "Enter") salIn.blur(); };
  ui.lbl = el("div", { className: "lbl" });
  ui.big = el("div", { className: "big" });
  ui.bar = el("i");
  ui.pct = el("div", { className: "pct" });
  ui.spent = el("b");
  ui.hero = el("div", { className: "hero" },
    ui.lbl, ui.big, el("div", { className: "track" }, ui.bar), ui.pct,
    el("div", { className: "two" },
      el("div", {}, el("small", { text: "Net salary" }), el("div", { className: "sal" }, el("span", { text: "RM" }), salIn)),
      el("div", {}, el("small", { text: "Spent" }), ui.spent)));
  return ui.hero;
}

function updateTotals() {
  const spent = spentCents(selectedMonth), sal = Math.round(salaryFor(selectedMonth) * 100);
  ui.spent.textContent = money(spent / 100);
  if (ui.total) ui.total.textContent = money(spent / 100);
  ui.hero.classList.remove("warn", "over");
  if (sal <= 0) {
    ui.lbl.textContent = "Spent this month";
    ui.big.textContent = money(spent / 100);
    ui.bar.style.width = "0%";
    ui.pct.textContent = "Enter your net salary to see what's left";
    return;
  }
  const left = sal - spent, pct = spent / sal;
  ui.lbl.textContent = left >= 0 ? "Left this month" : "Over by";
  ui.big.textContent = money(Math.abs(left) / 100);
  ui.bar.style.width = Math.min(100, Math.round(pct * 100)) + "%";
  ui.pct.textContent = `${Math.round(pct * 100)}% of your salary spent`;
  if (pct > 1) ui.hero.classList.add("over"); else if (pct >= 0.8) ui.hero.classList.add("warn");
}

function sheet() {
  const card = el("div", { className: "card" }, el("h3", { text: "WHAT YOU SPENT" }));
  const arr = linesOf(selectedMonth);
  if (arr.length === 0) {
    const prev = lastMonthWithLines(selectedMonth);
    const box = el("div", { className: "empty" }, el("p", { text: prev ? `Nothing here yet. Start from ${fmtMonthShort(prev)} or add lines one by one.` : "Nothing here yet. Add what you spend on — Rent, Food, Petrol…" }));
    if (prev) box.appendChild(el("div", { className: "row2" },
      el("button", { className: "btn pri", onClick: () => copyFrom(prev, true) }, "Copy lines + amounts"),
      el("button", { className: "btn", onClick: () => copyFrom(prev, false) }, "Copy names only")));
    card.appendChild(box);
  } else {
    arr.forEach((l) => card.appendChild(lineRow(l)));
  }
  card.appendChild(el("button", { className: "add", onClick: () => addLine() }, "+ Add a line"));
  if (arr.length) {
    ui.total = el("span", { text: "" });
    card.appendChild(el("div", { className: "tot" }, el("span", { text: "Total spent" }), ui.total));
    card.appendChild(el("div", { className: "hint", text: "Tip: tap ＋ to add another amount to a line (15 + 22.5). Names autofill from past months." }));
  } else ui.total = null;
  return card;
}

function lineRow(l) {
  const lb = el("input", { className: "lb", type: "text", placeholder: "What for?", value: l.label, list: "labels", autocomplete: "off",
    enterkeyhint: "next", maxlength: "60", "data-id": l.id, "aria-label": "What for" });
  const am = el("input", { className: "am", type: "text", inputmode: "decimal", placeholder: "0.00", value: l.expr, autocomplete: "off",
    enterkeyhint: "done", maxlength: "200", "aria-label": "Amount" });
  const sum = el("div", { className: "sum" });
  const setSum = () => { const n = terms(l.expr).length; sum.hidden = n <= 1; sum.textContent = "= " + money(evalExpr(l.expr)); };
  lb.oninput = () => { l.label = lb.value; save(); };
  lb.onchange = refreshLabels;
  lb.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); am.focus(); } };
  am.oninput = () => { l.expr = am.value; save(); setSum(); updateTotals(); };
  am.onkeydown = (e) => { if (e.key === "Enter") am.blur(); };
  const plus = el("button", { className: "pl", "aria-label": "Add another amount to this line",
    onClick: () => {
      if (am.value.trim() && !/[+-]$/.test(am.value.trim())) am.value = am.value.trim() + "+";
      l.expr = am.value; save(); setSum();
      am.focus(); const n = am.value.length; try { am.setSelectionRange(n, n); } catch (e) {}
    } }, "＋");
  const del = el("button", { className: "x", "aria-label": "Delete line", onClick: () => deleteLine(l) }, "×");
  setSum();
  return el("div", { className: "lw" }, el("div", { className: "line" }, lb, am, plus, del), sum);
}

function addLine(label, expr) {
  const l = { id: uid(), label: label || "", expr: expr || "" };
  linesOf(selectedMonth).push(l);
  justAddedId = l.id;               // keeps this one blank line alive through the next render
  save();
  render();
  const i = document.querySelector(`input.lb[data-id="${l.id}"]`);
  if (i) i.focus();
}

function deleteLine(l) {
  const mk = selectedMonth, arr = linesOf(mk), i = arr.findIndex((z) => z.id === l.id);
  if (i < 0) return;
  const removed = arr.splice(i, 1)[0];
  save(); render();
  toast(`Deleted ${removed.label || "line"}`, "Undo", () => {
    const a = linesOf(mk); a.splice(Math.min(i, a.length), 0, removed); save(); render();
  });
}

function copyFrom(prevKey, withAmounts) {
  const src = (state.months[prevKey] || []).filter((l) => l.label.trim() || l.expr.trim());
  state.months[selectedMonth] = src.map((l) => ({ id: uid(), label: l.label, expr: withAmounts && l.expr.trim() ? String(evalExpr(l.expr)) : "" }));
  save(); render();
  toast(`Copied ${src.length} line${src.length === 1 ? "" : "s"} from ${fmtMonthShort(prevKey)}`);
}

function history() {
  const keys = Object.keys(state.months).filter((k) => k !== selectedMonth && spentCents(k) > 0).sort().reverse().slice(0, 6);
  if (!keys.length) return null;
  const card = el("div", { className: "card" }, el("h3", { text: "OTHER MONTHS" }));
  keys.forEach((k) => {
    const spent = spentCents(k), sal = Math.round(salaryFor(k) * 100), left = sal - spent;
    card.appendChild(el("button", { className: "hist", onClick: () => { selectedMonth = k; render(); window.scrollTo(0, 0); } },
      el("div", {}, el("div", { className: "a", text: fmtMonthShort(k) }),
        el("div", { className: "b", text: sal > 0 ? `${money(spent / 100)} of ${money(sal / 100)}` : `${money(spent / 100)} spent` })),
      sal > 0 ? el("div", { className: "r " + (left < 0 ? "neg" : "pos"), text: (left < 0 ? "−" : "") + money(Math.abs(left) / 100) + (left < 0 ? " over" : " left") }) : null));
  });
  return card;
}

function refreshLabels() {
  const dl = document.getElementById("labels");
  dl.textContent = "";
  const count = new Map();
  Object.values(state.months).forEach((arr) => arr.forEach((l) => { const t = l.label.trim(); if (t) count.set(t, (count.get(t) || 0) + 1); }));
  [...count].sort((a, b) => b[1] - a[1]).slice(0, 40).forEach(([t]) => dl.appendChild(el("option", { value: t })));
}

/* ---------- page switcher ---------- */
function switcher() {
  const tab = (id, label) => el("button", { className: page === id ? "on" : "",
    onClick: () => { if (page === id) return; page = id; try { localStorage.setItem("budget-page", id); } catch (e) {} render(); window.scrollTo(0, 0); } }, label);
  return el("div", { className: "seg" }, tab("budget", "Budget"), tab("cards", "Cards"));
}

/* ---------- credit cards ---------- */
/* Separate from the monthly sheet on purpose: this only tracks what you owe each bank. */
const owedCents = (c) => c.entries.reduce((t, e) => t + (e.kind === "payment" ? -1 : 1) * Math.round(e.amount * 100), 0);

function dueText(c) {
  if (!c.due) return "";
  const now = new Date(), t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const mk = (y, m) => new Date(y, m, Math.min(c.due, new Date(y, m + 1, 0).getDate()));
  let d = mk(t0.getFullYear(), t0.getMonth());
  if (d < t0) d = mk(t0.getFullYear(), t0.getMonth() + 1);
  const days = Math.round((d - t0) / 86400000);
  const when = d.toLocaleDateString("en-US", { day: "numeric", month: "short" });
  return days === 0 ? `Payment due today (${when})` : `Next payment due ${when} · in ${days} day${days === 1 ? "" : "s"}`;
}

function updateCards() {
  let owedAll = 0, owedLim = 0, limAll = 0;
  state.cards.forEach((c) => {
    const o = owedCents(c), lim = Math.round(c.limit * 100), r = cardRefs[c.id];
    owedAll += Math.max(0, o);
    if (lim > 0) { limAll += lim; owedLim += Math.max(0, o); }
    if (!r) return;
    r.owed.textContent = o < 0 ? `Credit ${money(-o / 100)}` : money(o / 100);
    r.owed.classList.toggle("cr", o < 0);
    r.due.textContent = o > 0 ? dueText(c) : ""; r.due.hidden = !(o > 0 && c.due);
    r.name.textContent = c.name;
    if (lim > 0) {
      const p = Math.max(0, o) / lim;
      r.track.hidden = false; r.use.hidden = false;
      r.bar.style.width = Math.min(100, Math.round(p * 100)) + "%";
      r.track.className = "ctrack" + (p > 1 ? " over" : p >= 0.8 ? " warn" : "");
      r.use.textContent = `${Math.round(p * 100)}% of ${money(c.limit)} used · ` +
        (o > lim ? `over the limit by ${money((o - lim) / 100)}` : `${money((lim - Math.max(0, o)) / 100)} available`);
    } else { r.track.hidden = true; r.use.hidden = true; }
  });
  if (cardsHero) {
    cardsHero.big.textContent = money(owedAll / 100);
    cardsHero.sub.textContent = limAll > 0
      ? `${Math.round((owedLim / limAll) * 100)}% of your ${money(limAll / 100)} total limit used`
      : state.cards.length ? "Add a credit limit to a card to see how much you've used" : "";
  }
}

function cardsPage(root) {
  cardRefs = {};
  cardsHero = { big: el("div", { className: "big" }), sub: el("div", { className: "pct", style: "margin:0" }) };
  root.appendChild(el("div", { className: "hero" }, el("div", { className: "lbl", text: "Owed across your cards" }), cardsHero.big, cardsHero.sub));

  if (state.cards.length === 0)
    root.appendChild(el("div", { className: "card" }, el("div", { className: "empty" },
      el("p", { text: "Add a card to start. Log each charge when you swipe, and each payment when you pay the bill — it tracks what you still owe." }))));
  state.cards.forEach((c) => root.appendChild(cardBlock(c)));

  const nm = el("input", { type: "text", placeholder: "Card name (e.g. Maybank Visa)", maxlength: "40", autocomplete: "off", "aria-label": "Card name" });
  const addCard = () => {
    const name = nm.value.trim();
    if (!name) { nm.focus(); return; }
    state.cards.push({ id: uid(), name, limit: 0, due: 0, entries: [] });
    save(); editing.add(state.cards[state.cards.length - 1].id); render();
    toast("Card added — set its limit and due day if you like");
  };
  nm.onkeydown = (e) => { if (e.key === "Enter") addCard(); };
  root.appendChild(el("div", { className: "card" }, el("h3", { text: "ADD A CARD" }),
    el("div", { className: "line" }, nm, el("button", { className: "btn pri", style: "flex:0 0 auto;min-height:46px", onClick: addCard }, "Add"))));
  updateCards();
}

function cardBlock(c) {
  const r = cardRefs[c.id] = {};
  const box = el("div", { className: "card" });
  r.name = el("b", { text: c.name });
  const open = editing.has(c.id);
  box.appendChild(el("div", { className: "chead" }, r.name,
    el("button", { className: "mini", onClick: () => { if (open) editing.delete(c.id); else editing.add(c.id); render(); } }, open ? "Done" : "Edit")));

  if (open) {
    const nameIn = el("input", { type: "text", value: c.name, maxlength: "40", "aria-label": "Card name" });
    nameIn.oninput = () => { c.name = nameIn.value.trim() || "Card"; save(); updateCards(); };
    const limIn = el("input", { type: "text", inputmode: "decimal", placeholder: "No limit set", value: c.limit > 0 ? String(c.limit) : "", "aria-label": "Credit limit" });
    limIn.oninput = () => { c.limit = Math.max(0, evalExpr(limIn.value)); save(); updateCards(); };
    const dueIn = el("input", { type: "text", inputmode: "numeric", placeholder: "e.g. 25", maxlength: "2", value: c.due > 0 ? String(c.due) : "", "aria-label": "Payment due day of month" });
    dueIn.oninput = () => { c.due = Math.min(31, Math.max(0, parseInt(dueIn.value, 10) || 0)); save(); updateCards(); };
    const del = el("button", { className: "btn dng", style: "width:100%;margin-top:10px", onClick: () => {
      const i = state.cards.findIndex((z) => z.id === c.id), removed = state.cards.splice(i, 1)[0];
      editing.delete(c.id); save(); render();
      toast(`Deleted ${removed.name}`, "Undo", () => { state.cards.splice(Math.min(i, state.cards.length), 0, removed); save(); render(); });
    } }, "Delete this card");
    box.appendChild(el("div", { className: "cedit" },
      el("label", {}, el("span", { text: "Name" }), nameIn),
      el("label", {}, el("span", { text: "Credit limit (RM)" }), limIn),
      el("label", {}, el("span", { text: "Payment due day of month" }), dueIn), del));
  }

  r.owed = el("div", { className: "owed" });
  r.bar = el("i"); r.track = el("div", { className: "ctrack" }, r.bar);
  r.use = el("div", { className: "hint", style: "padding:6px 0 0" });
  r.due = el("div", { className: "due" });
  box.appendChild(el("div", { className: "lbl2", text: "Owed now" }));
  box.appendChild(r.owed); box.appendChild(r.track); box.appendChild(r.use); box.appendChild(r.due);

  /* quick add */
  const lb = el("input", { className: "lb", type: "text", placeholder: "What for? (optional)", maxlength: "60", autocomplete: "off", "data-add": c.id, "aria-label": "What for" });
  const am = el("input", { className: "am", type: "text", inputmode: "decimal", placeholder: "0.00", autocomplete: "off", "aria-label": "Amount" });
  const add = (kind) => {
    const amt = Math.abs(evalExpr(am.value));
    if (!(amt > 0)) { am.focus(); toast("Enter an amount first"); return; }
    c.entries.push({ id: uid(), date: todayISO(), kind, label: lb.value.trim(), amount: amt });
    save(); render();
    toast(kind === "payment" ? `Payment of ${money(amt)} logged` : `Charge of ${money(amt)} logged`);
    const f = document.querySelector(`input[data-add="${c.id}"]`); if (f) f.focus();
  };
  lb.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); am.focus(); } };
  am.onkeydown = (e) => { if (e.key === "Enter") add("charge"); };
  box.appendChild(el("div", { className: "addbox" },
    el("div", { className: "line" }, lb, am),
    el("div", { className: "row2", style: "margin:8px 0 0" },
      el("button", { className: "btn pri", onClick: () => add("charge") }, "＋ Charge"),
      el("button", { className: "btn", onClick: () => add("payment") }, "− Payment"))));

  /* history */
  const list = c.entries.map((e, i) => ({ e, i })).sort((a, b) => (a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : b.i - a.i)).map((x) => x.e);
  if (list.length) {
    const all = showAllFor.has(c.id), shown = all ? list : list.slice(0, 6);
    box.appendChild(el("h3", { style: "margin:16px 0 4px", text: "HISTORY" }));
    shown.forEach((e) => box.appendChild(entryRow(c, e)));
    if (list.length > 6) box.appendChild(el("button", { className: "add", style: "height:40px;border-style:solid", onClick: () => { if (all) showAllFor.delete(c.id); else showAllFor.add(c.id); render(); } },
      all ? "Show fewer" : `Show all ${list.length}`));
  }
  return box;
}

function entryRow(c, e) {
  const lb = el("input", { className: "lb", type: "text", value: e.label, placeholder: e.kind === "payment" ? "Payment" : "What for?", maxlength: "60", autocomplete: "off", "aria-label": "What for" });
  const am = el("input", { className: "am", type: "text", inputmode: "decimal", value: String(e.amount), autocomplete: "off", "aria-label": "Amount" });
  const dt = el("input", { className: "dt", type: "date", value: e.date, "aria-label": "Date" });
  const kind = el("button", { className: "kind" + (e.kind === "payment" ? " pay" : "") }, e.kind === "payment" ? "Payment" : "Charge");
  lb.oninput = () => { e.label = lb.value; save(); };
  am.oninput = () => { e.amount = Math.round(Math.abs(evalExpr(am.value)) * 100) / 100; save(); updateCards(); };
  dt.onchange = () => { if (isDay(dt.value)) { e.date = dt.value; save(); } };
  kind.onclick = () => {
    e.kind = e.kind === "payment" ? "charge" : "payment";
    kind.textContent = e.kind === "payment" ? "Payment" : "Charge"; kind.classList.toggle("pay", e.kind === "payment");
    lb.placeholder = e.kind === "payment" ? "Payment" : "What for?"; save(); updateCards();
  };
  const del = el("button", { className: "x", "aria-label": "Delete entry", onClick: () => {
    const i = c.entries.findIndex((z) => z.id === e.id), removed = c.entries.splice(i, 1)[0];
    save(); render();
    toast("Entry deleted", "Undo", () => { c.entries.splice(Math.min(i, c.entries.length), 0, removed); save(); render(); });
  } }, "×");
  return el("div", { className: "lw" }, el("div", { className: "line" }, lb, am, del), el("div", { className: "meta2" }, dt, kind));
}

/* ---------- settings / backup / updates ---------- */
const modal = () => document.getElementById("modal");
function closeModal() { modal().hidden = true; modal().firstChild.textContent = ""; document.body.style.overflow = ""; }
function openModal(node) {
  const s = modal().firstChild; s.textContent = ""; s.appendChild(node);
  modal().hidden = false; s.scrollTop = 0; document.body.style.overflow = "hidden";
  modal().onclick = (e) => { if (e.target === modal()) closeModal(); };
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !modal().hidden) closeModal(); });

function openSettings() {
  const box = el("div", {});
  box.appendChild(el("h2", { text: "Settings" }));

  box.appendChild(el("h4", { text: "BACKUP" }));
  box.appendChild(el("p", { text: "Your numbers live only in this browser. Download a backup now and then, and restore it if you switch phone or browser." }));
  box.appendChild(el("button", { className: "btn", style: "width:100%", onClick: exportBackup }, "Download backup"));
  const file = el("input", { type: "file", accept: "application/json,.json" });
  const restore = el("div", {});
  file.onchange = () => {
    const f = file.files && file.files[0];
    if (!f) return;
    restore.textContent = "";
    const err = el("div", { className: "msg bad" });
    restore.appendChild(el("p", { style: "margin-top:10px", text: `Replace everything here with "${f.name}"?` }));
    restore.appendChild(err);
    restore.appendChild(el("div", { className: "row2" },
      el("button", { className: "btn", onClick: () => { file.value = ""; restore.textContent = ""; } }, "Cancel"),
      el("button", { className: "btn dng", onClick: () => importBackup(f, () => { closeModal(); toast("Backup restored"); }, (m) => { err.textContent = m; }) }, "Replace")));
  };
  box.appendChild(el("p", { style: "margin:14px 0 2px", text: "Restore from a backup file" }));
  box.appendChild(file);
  box.appendChild(restore);

  box.appendChild(el("h4", { text: "APP" }));
  const status = el("div", { className: "msg", text: `Version ${APP_VERSION}` });
  const upd = el("button", { className: "btn", style: "width:100%", onClick: async () => {
    status.className = "msg"; status.textContent = "Checking…";
    const r = await checkForUpdate();
    if (r === "available") { status.textContent = `Version ${latestVersion} is available.`; showBanner(); box.appendChild(el("button", { className: "btn pri", style: "width:100%;margin-top:8px", onClick: applyUpdate }, "Update now")); upd.disabled = true; }
    else if (r === "current") status.textContent = `You're on the latest version (${APP_VERSION}).`;
    else { status.className = "msg bad"; status.textContent = "Couldn't check — are you offline?"; }
  } }, "Check for updates");
  box.appendChild(upd);
  box.appendChild(status);

  box.appendChild(el("div", { className: "row2", style: "margin-top:18px" }, el("button", { className: "btn", onClick: closeModal }, "Done")));
  openModal(box);
}

function exportBackup() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  const d = new Date(), a = document.createElement("a");
  a.href = url; a.download = `budget-backup-${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importBackup(file, ok, bad) {
  const r = new FileReader();
  r.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(r.result)); } catch (e) { bad("That isn't a valid backup file."); return; }
    const next = normalize(parsed);
    if (Object.keys(next.months).length === 0 && Object.keys(next.salary).length === 0 && next.cards.length === 0) { bad("That file has no recognisable data."); return; }
    state = next; save(); render(); ok();
  };
  r.onerror = () => bad("Couldn't read that file.");
  r.readAsText(file);
}

/* Update check that doesn't depend on the service worker: compare against version.json. */
let latestVersion = null;
async function checkForUpdate() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return "offline";
    const j = await r.json();
    if (j && typeof j.version === "string") { latestVersion = j.version; return j.version !== APP_VERSION ? "available" : "current"; }
  } catch (e) {}
  return "offline";
}
function showBanner() {
  const b = document.getElementById("banner");
  if (b.querySelector(".upd")) return;
  b.appendChild(el("div", { className: "upd" }, el("span", { text: "A new version is available" }), el("button", { onClick: applyUpdate }, "Update")));
}
async function applyUpdate() {
  try {
    if (navigator.serviceWorker) (await navigator.serviceWorker.getRegistrations()).forEach((r) => r.unregister());
    if (window.caches) (await caches.keys()).forEach((k) => caches.delete(k));
    await fetch(location.pathname, { cache: "reload" });   // refresh the browser's own cached copy too
  } catch (e) {}
  location.reload();
}
function autoCheck() { checkForUpdate().then((r) => { if (r === "available") showBanner(); }); }

/* ---------- start ---------- */
load();
selectedMonth = monthKey(new Date());
render();
autoCheck();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") autoCheck(); });
window.addEventListener("online", autoCheck);

if ("serviceWorker" in navigator) {
  let reloaded = false;
  const had = !!navigator.serviceWorker.controller;
  const safeReload = () => { if (reloaded || !modal().hidden) return; reloaded = true; location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had) safeReload(); });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.update();
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) safeReload(); });
      });
    }).catch(() => {});
  });
}
