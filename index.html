<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#26215C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expenses">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Expenses</title>
<style>
  :root {
    --accent:#26215C; --accent-ink:#fff;
    --bg:#f6f6f8; --card:#fff; --text:#1a1a1a; --muted:#6b6b72;
    --line:rgba(0,0,0,0.08); --track:#ececf0; --danger:#A32D2D; --over:#E24B4A;
    --radius:12px;
  }
  @media (prefers-color-scheme:dark){ :root{
    --accent:#2f296e; --bg:#121216; --card:#1c1c22; --text:#f2f2f4;
    --muted:#9a9aa2; --line:rgba(255,255,255,0.10); --track:#2a2a32;
  }}
  *{box-sizing:border-box}
  body{margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:var(--bg); color:var(--text)}
  button{font:inherit; cursor:pointer}
  #app{max-width:420px; margin:0 auto; padding:12px 14px calc(120px + env(safe-area-inset-bottom))}
  [hidden]{display:none !important}
  .notice{background:#EF9F27; color:#412402; border-radius:var(--radius); padding:8px 12px; font-size:13px; margin-bottom:10px}

  .hdr{display:flex; align-items:center; justify-content:space-between; padding:6px 2px 12px}
  .hdr .month{display:flex; align-items:center; gap:12px}
  .hdr .month b{font-weight:500; font-size:16px}
  .iconbtn{width:44px; height:44px; min-width:44px; border-radius:50%; border:1px solid var(--line);
           background:var(--card); color:var(--text); display:flex; align-items:center; justify-content:center; font-size:16px}

  .hero{background:var(--accent); color:var(--accent-ink); border-radius:18px; padding:20px; margin-bottom:16px}
  .hero .lbl{font-size:12px; opacity:.75}
  .hero .big{font-size:30px; font-weight:500; margin:3px 0 4px}
  .hero .sub{font-size:12px; opacity:.85}

  .sec-title{font-size:13px; font-weight:500; color:var(--muted); margin:14px 2px 8px; display:flex; justify-content:space-between; align-items:baseline}
  .sec-title .link{color:#8b83e0; font-weight:500; background:none; border:none; padding:0}
  @media (prefers-color-scheme:dark){ .sec-title .link{color:#CECBF6} }
  .empty{color:var(--muted); font-size:14px; padding:8px 2px 16px}

  .cat-row{display:flex; align-items:center; gap:12px; padding:9px 2px}
  .tile{width:34px; height:34px; min-width:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px}
  .dot{width:8px; height:8px; border-radius:99px; flex:0 0 8px}
  .grow{flex:1; min-width:0}
  .cat-row .nm{font-size:14px; font-weight:500}
  .cat-row .rt{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
  .cat-row .am{font-size:13px; color:var(--muted); white-space:nowrap}
  .cbar{height:5px; background:var(--track); border-radius:99px; margin-top:6px; overflow:hidden}
  .cbar>i{display:block; height:100%; border-radius:99px}

  .emoji-dot{width:20px; text-align:center; flex:0 0 20px; font-size:15px}
  .exp-row{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
           padding:10px 6px; text-align:left; background:var(--bg); color:inherit; border:none; position:relative}
  .exp-row .desc{font-size:14px}
  .exp-row .meta{font-size:11px; color:var(--muted)}
  .exp-row .amt{font-size:14px; font-weight:500; white-space:nowrap}

  .swipe-wrap{position:relative; overflow:hidden; border-bottom:1px solid var(--line)}
  .swipe-wrap:last-child{border-bottom:none}
  .swipe-actions{position:absolute; top:0; right:0; bottom:0; display:flex}
  .swipe-actions button{border:none; color:#fff; font-size:13px; font-weight:600; width:70px}
  .swipe-actions .e{background:#378ADD}
  .swipe-actions .d{background:var(--over)}
  .exp-row.swipe-inner{touch-action:pan-y; will-change:transform}

  .day-head{display:flex; justify-content:space-between; align-items:baseline; font-size:12px; color:var(--muted); font-weight:500; margin:16px 2px 4px}

  .quick-wrap{margin:2px 0 12px}
  .qb-nudge{font-size:12px; color:var(--muted); margin:0 2px 6px}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; font-size:12px; font-weight:500; padding:8px 13px; border-radius:999px;
        border:1px solid var(--line); background:var(--card); color:var(--muted); white-space:nowrap}
  .chip.active{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .qchip{background:var(--accent); color:var(--accent-ink); border-color:transparent; padding:9px 14px}

  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; justify-content:center; gap:4px;
          background:var(--card); border-top:1px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1; max-width:140px; background:none; border:none; color:var(--muted); font-size:11px; font-weight:500;
                 display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; border-radius:10px}
  .tabbar button .ic{font-size:19px; line-height:1}
  .tabbar button.active{color:var(--accent)}
  @media (prefers-color-scheme:dark){ .tabbar button.active{color:#CECBF6} }
  .fab{position:fixed; right:calc(50% - 210px + 16px); bottom:calc(74px + env(safe-area-inset-bottom));
       width:52px; height:52px; border-radius:50%; border:none; z-index:9;
       background:var(--accent); color:var(--accent-ink); font-size:26px; box-shadow:0 4px 14px rgba(0,0,0,0.25)}
  @media (max-width:452px){ .fab{right:16px} }

  #toasts{position:fixed; left:0; right:0; bottom:calc(80px + env(safe-area-inset-bottom)); z-index:11;
          display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
  .toast{pointer-events:auto; background:var(--text); color:var(--bg); font-size:13px; font-weight:500;
         border-radius:999px; padding:10px 16px; display:flex; align-items:center; gap:12px;
         max-width:calc(100vw - 32px); box-shadow:0 4px 14px rgba(0,0,0,0.25)}
  .toast button{background:none; border:none; color:#9db8ff; font-weight:600; font-size:13px; padding:0}

  .modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end;
                 justify-content:center; z-index:10; overflow-y:auto}
  .modal-card{background:var(--card); color:var(--text); width:100%; max-width:420px; border-radius:18px 18px 0 0;
              padding:18px 16px 22px; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch}
  @media (min-width:480px){ .modal-overlay{align-items:center} .modal-card{border-radius:18px} }
  .modal-card h2{font-size:16px; font-weight:500; margin:0 0 12px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .field input,.field select{width:100%; font:inherit; padding:10px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--bg); color:var(--text); min-height:44px}
  .err{color:var(--danger); font-size:12px; margin:2px 0 8px}
  .modal-actions{display:flex; gap:10px; margin-top:6px}
  .btn{flex:1; min-height:46px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-weight:500}
  .btn.primary{background:var(--accent); color:var(--accent-ink); border-color:transparent}
  .btn.danger{background:none; color:var(--danger); border-color:var(--danger)}
  .quick-add{display:flex; gap:6px; margin-top:8px}
  .quick-add .chip{flex:1; text-align:center}

  .set-h{font-size:13px; font-weight:500; color:var(--muted); margin:22px 0 8px}
  .row-edit{border-bottom:1px solid var(--line); padding:10px 0}
  .row-edit .r{display:flex; gap:8px; align-items:center}
  .row-edit .r + .r{margin-top:8px}
  .row-edit input,.row-edit select{font:inherit; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); min-height:44px; min-width:0; flex:1}
  .row-edit .em{flex:0 0 46px; width:46px; text-align:center}
  .row-edit .am{flex:0 0 90px; width:90px}
  .row-edit .reorder{flex:0 0 auto; min-width:38px; min-height:44px; padding:0; border-radius:9px;
    border:1px solid var(--line); background:var(--card); color:var(--text); font-size:15px}
  .row-edit .reorder[disabled]{opacity:.35}
  .row-edit .del{flex:0 0 auto; min-height:44px; border-radius:9px; border:1px solid var(--danger);
    background:none; color:var(--danger); padding:0 12px; white-space:nowrap}
  .add-row{display:flex; gap:8px; margin-top:14px}
  .add-row input{flex:1; min-width:0; font:inherit; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); min-height:44px}
  .add-row button{flex:0 0 auto}
  .reassign{padding:8px 0 12px; border-bottom:1px solid var(--line)}
  .set-msg{color:var(--danger); font-size:12px; margin-top:6px}
  .set-ver{text-align:center; font-size:12px; color:var(--muted); margin-top:18px}

  .tchart-wrap{border:1px solid var(--line); border-radius:16px; padding:14px 14px 10px; margin-bottom:16px}
  .tchart{display:flex; align-items:flex-end; gap:6px; height:150px}
  .tbar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:5px; height:100%; background:none; border:none; color:inherit}
  .tbar .col{width:64%; max-width:30px; background:var(--accent); border-radius:5px 5px 0 0; min-height:3px}
  .tbar.cur .col{background:#7F77DD}
  .tbar .lbl{font-size:10px; color:var(--muted); white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div id="storage-notice" class="notice" hidden>Changes won't be saved in this browser.</div>
  <div id="content"></div>
</div>
<div id="chrome"></div>
<div id="toasts"></div>
<div id="modal" class="modal-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true"></div>
</div>
<script>
"use strict";

const APP_VERSION = "v23 · 2026-09-10";
const KEY = "expense-tracker-v1";
const BACKUP_KEY = "expense-tracker-v1-backup";
const TAB_KEY = "expense-tracker-tab";
let storageAvailable = true;

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10));

function DEFAULT_STATE() {
  return {
    version: 1,
    categories: [
      { id: uid(), name: "Food", emoji: "🍔" },
      { id: uid(), name: "Transport", emoji: "🚗" },
      { id: uid(), name: "Bills", emoji: "🧾" },
    ],
    expenses: [],
    quick: [],
  };
}

let state = DEFAULT_STATE();

function catInList(list, id) { return list.find((c) => c.id === id); }

function normalize(obj) {
  const s = DEFAULT_STATE();
  const okCat = (c) => c && typeof c.id === "string" && typeof c.name === "string";
  const okExp = (e) => e && typeof e.id === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date || "") && Number.isFinite(Number(e.amount));
  if (obj && Array.isArray(obj.categories)) s.categories = obj.categories.filter(okCat)
    .map((c) => ({ id: c.id, name: String(c.name), emoji: typeof c.emoji === "string" ? c.emoji.slice(0, 4) : "" }));
  if (obj && Array.isArray(obj.expenses)) s.expenses = obj.expenses.filter(okExp)
    .map((e) => ({ id: e.id, amount: Number(e.amount), categoryId: typeof e.categoryId === "string" ? e.categoryId : "",
      date: e.date, description: typeof e.description === "string" ? e.description : "" }));

  const quick = [];
  const seen = new Set();
  const addQuick = (label, amount, categoryId) => {
    const l = String(label || "").trim();
    const a = Number(amount);
    if (!l || !isFinite(a) || a <= 0 || seen.has(l.toLowerCase())) return;
    seen.add(l.toLowerCase());
    quick.push({ id: uid(), label: l, amount: Math.round(a * 100) / 100,
      categoryId: catInList(s.categories, categoryId) ? categoryId : (s.categories[0] ? s.categories[0].id : "") });
  };
  if (obj && Array.isArray(obj.quick)) obj.quick.forEach((q) => q && addQuick(q.label || q.name, q.amount, q.categoryId));
  if (obj && Array.isArray(obj.commitments)) obj.commitments.forEach((c) => c && addQuick(c.name, c.amount, s.categories[0] && s.categories[0].id));
  if (obj && Array.isArray(obj.recurring)) obj.recurring.forEach((r) => r && addQuick(r.name, r.amount, r.categoryId));
  s.quick = quick;

  s.version = 1;
  return s;
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); }
  catch (e) { storageAvailable = false; state = DEFAULT_STATE(); return; }
  if (raw == null) { state = DEFAULT_STATE(); save(); return; }
  try {
    const parsed = JSON.parse(raw);
    state = normalize(parsed);
    const badShape = !parsed || typeof parsed !== "object" || Array.isArray(parsed);
    const rawExps = parsed && Array.isArray(parsed.expenses) ? parsed.expenses.length : 0;
    if (badShape || state.expenses.length < rawExps) { try { localStorage.setItem(BACKUP_KEY, raw); } catch (_) {} }
  } catch (e) {
    try { localStorage.setItem(BACKUP_KEY, raw); } catch (_) {}
    state = DEFAULT_STATE(); save();
  }
}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) {
    storageAvailable = false;
    const n = document.getElementById("storage-notice");
    if (n) { n.textContent = "Couldn't save — changes will be lost when you close this page."; n.hidden = false; }
  }
}

/* ---------- helpers ---------- */
let selectedMonth;
let activeTab = "overview";
try { const t = localStorage.getItem(TAB_KEY); if (["overview", "expenses", "trends"].includes(t)) activeTab = t; } catch (e) {}
let expFilter = { q: "", categoryId: null };
let lastCategoryId = null;
let toastTimer = null;

const pad2 = (n) => String(n).padStart(2, "0");
const monthKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const fmtMonth = (key) => { const [y, m] = key.split("-").map(Number); return new Date(y, m - 1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" }); };
const monthShort = (key) => fmtMonth(key).split(" ")[0];
function shiftMonth(key, delta) { const [y, m] = key.split("-").map(Number); return monthKey(new Date(y, m - 1 + delta, 1)); }
function fmtDayShort(iso) { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); }
function dayLabel(iso) {
  if (iso === todayISO()) return "Today";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (iso === `${y.getFullYear()}-${pad2(y.getMonth() + 1)}-${pad2(y.getDate())}`) return "Yesterday";
  const [yr, m, d] = iso.split("-").map(Number);
  return new Date(yr, m - 1, d).toLocaleDateString("en-US", { weekday: "short", day: "numeric", month: "short" });
}

const nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (n) => "RM " + nf2.format(n);
const centsOf = (n) => { const c = Math.round(Number(n) * 100); return Number.isFinite(c) ? c : 0; };
const sumCents = (a) => a.reduce((t, x) => t + x, 0);
const fromCents = (c) => c / 100;

const categoryById = (id) => state.categories.find((c) => c.id === id);
const CAT_PALETTE = ["#EF9F27", "#E24B4A", "#1D9E75", "#378ADD", "#7F77DD", "#D4537E", "#0F6E56", "#BA7517"];
const catColor = (i) => CAT_PALETTE[i % CAT_PALETTE.length];

function expensesForMonth(key) {
  return state.expenses
    .map((e, i) => ({ e, i }))
    .filter((x) => (x.e.date || "").slice(0, 7) === key)
    .sort((a, b) => (a.e.date < b.e.date ? 1 : a.e.date > b.e.date ? -1 : b.i - a.i))
    .map((x) => x.e);
}
const monthSpentCents = (key) => sumCents(expensesForMonth(key).map((e) => centsOf(e.amount)));
function spentByCategory(key) {
  const m = new Map();
  for (const e of state.expenses) {
    if ((e.date || "").slice(0, 7) !== key) continue;
    const k = categoryById(e.categoryId) ? e.categoryId : "__uncat__";
    m.set(k, (m.get(k) || 0) + centsOf(e.amount));
  }
  return m;
}

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (tag === "button" && !(props && "type" in props)) n.type = "button";
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "className") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") n[k.toLowerCase()] = v;
    else if (v != null) n.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null) continue; n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); }
  return n;
}

/* ---------- toast + delete-with-undo ---------- */
function toast(msg, actionLabel, actionFn) {
  const host = document.getElementById("toasts");
  host.textContent = "";
  const t = el("div", { className: "toast" }, el("span", { text: msg }));
  if (actionLabel) t.appendChild(el("button", { onClick: () => { host.textContent = ""; if (toastTimer) clearTimeout(toastTimer); actionFn(); } }, actionLabel));
  host.appendChild(t);
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { if (host.firstChild === t) host.textContent = ""; }, actionLabel ? 6000 : 2200);
}
function deleteExpenseWithUndo(id) {
  const idx = state.expenses.findIndex((e) => e.id === id);
  if (idx < 0) return;
  const removed = state.expenses[idx];
  state.expenses.splice(idx, 1);
  save(); render();
  toast("Expense deleted", "Undo", () => {
    state.expenses.splice(Math.min(idx, state.expenses.length), 0, removed);
    save(); render();
  });
}

/* ---------- render ---------- */
function render() {
  const root = document.getElementById("content");
  root.textContent = "";
  try {
    root.appendChild(renderHeader());
    if (activeTab === "expenses") root.appendChild(renderExpensesTab());
    else if (activeTab === "trends") root.appendChild(renderTrendsTab());
    else root.appendChild(renderOverviewTab());
  } catch (err) {
    console.error(err);
    root.appendChild(el("div", { className: "notice", text: "Something went wrong. Reload the page." }));
  }
  renderChrome();
}

function renderChrome() {
  const chrome = document.getElementById("chrome");
  chrome.textContent = "";
  const tab = (id, icon, label) => el("button", {
    className: activeTab === id ? "active" : "", "aria-label": label,
    onClick: () => { activeTab = id; try { localStorage.setItem(TAB_KEY, id); } catch (e) {} expFilter = { q: "", categoryId: null }; render(); } },
    el("span", { className: "ic", text: icon }), el("span", { text: label }));
  chrome.appendChild(el("div", { className: "tabbar" },
    tab("overview", "◎", "Overview"), tab("expenses", "≡", "Expenses"), tab("trends", "▥", "Trends")));
  chrome.appendChild(el("button", { className: "fab", "aria-label": "Add expense",
    onClick: () => { if (state.categories.length === 0) return openNeedCategory(); openExpenseForm(null); } }, "+"));
}

function renderHeader() {
  return el("div", { className: "hdr" },
    el("div", { className: "month" },
      el("button", { className: "iconbtn", "aria-label": "Previous month",
        onClick: () => { selectedMonth = shiftMonth(selectedMonth, -1); render(); } }, "‹"),
      el("b", { text: fmtMonth(selectedMonth) }),
      el("button", { className: "iconbtn", "aria-label": "Next month",
        onClick: () => { selectedMonth = shiftMonth(selectedMonth, 1); render(); } }, "›")),
    el("button", { className: "iconbtn", "aria-label": "Settings", onClick: openSettings }, "⚙"));
}

/* ----- Overview ----- */
function renderOverviewTab() {
  const box = el("div", {});
  box.appendChild(renderQuickBar());
  box.appendChild(renderHero());
  box.appendChild(renderByCategory());
  box.appendChild(renderRecent());
  return box;
}

function renderHero() {
  const spent = monthSpentCents(selectedMonth);
  const prev = monthSpentCents(shiftMonth(selectedMonth, -1));
  const count = expensesForMonth(selectedMonth).length;
  const sub = prev > 0
    ? `${monthShort(shiftMonth(selectedMonth, -1))}: ${money(fromCents(prev))}`
    : `${count} expense${count === 1 ? "" : "s"}`;
  return el("div", { className: "hero" },
    el("div", { className: "lbl", text: `Spent in ${monthShort(selectedMonth)}` }),
    el("div", { className: "big", text: money(fromCents(spent)) }),
    el("div", { className: "sub", text: sub }));
}

function renderByCategory() {
  const box = el("div", {});
  box.appendChild(el("div", { className: "sec-title" }, el("span", { text: "By category" })));
  const map = spentByCategory(selectedMonth);
  const total = sumCents([...map.values()]);
  if (total === 0) { box.appendChild(el("div", { className: "empty", text: `Nothing logged in ${monthShort(selectedMonth)} yet.` })); return box; }
  const items = state.categories.map((c, i) => ({ name: c.name, emoji: c.emoji, cents: map.get(c.id) || 0, color: catColor(i) }));
  if (map.get("__uncat__")) items.push({ name: "Uncategorized", emoji: "", cents: map.get("__uncat__"), color: "var(--muted)" });
  items.filter((x) => x.cents > 0).sort((a, b) => b.cents - a.cents).forEach((x) => {

function expenseMatches(e, q) {

function closeOtherSwipes(except) {
  document.querySelectorAll('.swipe-wrap[data-open="1"]').forEach((w) => {
    if (w === except) return;
    w.dataset.open = "0";
    const i = w.querySelector(".swipe-inner");
    if (i) { i.style.transition = "transform .18s ease"; i.style.transform = "translateX(0)"; }
  });
}
function swipeRow(inner, onEdit, onDelete) {
  const OPEN = -140;
  const wrap = el("div", { className: "swipe-wrap" });
  wrap.dataset.open = "0";
  wrap.appendChild(el("div", { className: "swipe-actions" },
    el("button", { className: "e", onClick: (ev) => { ev.stopPropagation(); onEdit(); } }, "Edit"),
    el("button", { className: "d", onClick: (ev) => { ev.stopPropagation(); onDelete(); } }, "Delete")));
  inner.classList.add("swipe-inner");
  wrap.appendChild(inner);
  let sx = 0, sy = 0, dx = 0, drag = false, dir = null, moved = false;
  const setX = (x) => { inner.style.transform = `translateX(${x}px)`; };
  inner.addEventListener("touchstart", (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; drag = true; dir = null; moved = false; inner.style.transition = "none"; }, { passive: true });
  inner.addEventListener("touchmove", (e) => {
    if (!drag) return;
    const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if (dir === null && (Math.abs(mx) > 6 || Math.abs(my) > 6)) dir = Math.abs(mx) > Math.abs(my) ? "h" : "v";
    if (dir !== "h") return;
    e.preventDefault(); moved = true;
    const base = wrap.dataset.open === "1" ? OPEN : 0;
    dx = Math.max(OPEN, Math.min(0, base + mx)); setX(dx);
  }, { passive: false });
  const end = () => {
    if (!drag) return; drag = false;
    inner.style.transition = "transform .18s ease";
    if (dir === "h") { const open = dx < OPEN / 2; setX(open ? OPEN : 0); wrap.dataset.open = open ? "1" : "0"; if (open) closeOtherSwipes(wrap); }
  };
  inner.addEventListener("touchend", end); inner.addEventListener("touchcancel", end);
  inner.addEventListener("click", (e) => {
    if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; return; }
    if (wrap.dataset.open === "1") { e.preventDefault(); e.stopPropagation(); wrap.dataset.open = "0"; setX(0); }
  }, true);
  return wrap;
}

    if (!nm || !isFinite(a) || a <= 0) { msg.textContent = "Enter a label and an amount above 0."; return; }
    if (state.categories.length === 0) { msg.textContent = "Add a category first."; return; }
    msg.textContent = ""; state.quick.push({ id: uid(), label: nm, amount: Math.round(a * 100) / 100, categoryId: qC.value });
    save(); render(); refresh();
  };
  card.appendChild(el("div", { className: "row-edit" }, el("div", { className: "r" }, qL, qA), el("div", { className: "r" }, qC, qBtn)));

  /* Backup */
  const bh = el("div", { className: "set-h", text: "Backup" });
  card.appendChild(bh);
  card.appendChild(el("div", { className: "empty", style: "margin:-4px 0 8px",
    text: "Your data lives only in this browser. Download a backup now and again; use Restore after switching phone or browser." }));
  card.appendChild(el("button", { className: "btn", style: "width:100%;margin-bottom:10px", onClick: exportBackup }, "Download backup"));
  const fileI = el("input", { type: "file", accept: "application/json,.json" });
  const restoreArea = el("div", {});
  restoreArea.appendChild(el("div", { className: "empty", style: "margin-top:6px", text: "Restoring replaces everything here." }));
  fileI.onchange = () => {
    const file = fileI.files && fileI.files[0];
    if (!file) return;
    restoreArea.textContent = "";
    const errLine = el("div", { className: "set-msg" });
    restoreArea.appendChild(el("div", { className: "empty", style: "margin:6px 0", text: `Replace everything with "${file.name}"?` }));
    restoreArea.appendChild(errLine);
    restoreArea.appendChild(el("div", { className: "modal-actions", style: "margin-top:8px" },
      el("button", { className: "btn", onClick: () => { fileI.value = ""; refresh(); } }, "Cancel"),
      el("button", { className: "btn danger", onClick: () => importBackup(file, () => { closeModal(); openSettings("backup"); }, (e) => { errLine.textContent = e; }) }, "Replace")));
  };
  card.appendChild(field("Restore from a backup file", fileI));
  card.appendChild(restoreArea);

  card.appendChild(msg);
  card.appendChild(el("div", { className: "modal-actions", style: "margin-top:16px" }, el("button", { className: "btn", onClick: closeModal }, "Done")));
  card.appendChild(el("div", { className: "set-ver", text: `Expenses ${APP_VERSION}` }));

  if (scrollTo) {
    const target = scrollTo === "quick" ? qh : scrollTo === "backup" ? bh : null;
    if (target) requestAnimationFrame(() => target.scrollIntoView());
  }
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `expenses-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function importBackup(file, onDone, onErr) {
  const r = new FileReader();
  r.onload = () => {
    let parsed;
    try { parsed = JSON.parse(String(r.result)); } catch (e) { onErr("Couldn't read that file — is it a valid backup?"); return; }
    const next = normalize(parsed);
    if (!next.categories.length && !next.expenses.length) { onErr("That file has no recognizable data."); return; }
    state = next; save(); render(); onDone();
  };
  r.onerror = () => onErr("Couldn't read that file.");
  r.readAsText(file);
}

/* ---------- start ---------- */
load();
selectedMonth = monthKey(new Date());
if (!storageAvailable) document.getElementById("storage-notice").hidden = false;
render();

if ("serviceWorker" in navigator) {
  let didReload = false;
  const hadController = !!navigator.serviceWorker.controller;
  const safeReload = () => { if (didReload) return; if (modal() && !modal().hidden) return; didReload = true; location.reload(); };
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController) safeReload(); });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      reg.update();
      setInterval(() => reg.update(), 3600000);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (nw) nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) safeReload();
        });
      });
    }).catch(() => {});
  });
}
</script>
